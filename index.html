<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO & Metadata -->
    <!-- __PROFILE_NAME__ is replaced at build time (vite.config.ts) with the name in src/config/profile.ts -->
    <title>__PROFILE_NAME__ | UX/UI Designer & Frontend Developer</title>
    <meta name="description" content="Portfolio of __PROFILE_NAME__ - UX/UI Designer & Frontend Developer inspired by cutting-edge digital experiences, interactive web applications, and cyber design aesthetics." />
    
    <!-- Security Meta Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://api.github.com https://api.microlink.io; frame-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <!-- X-Frame-Options / X-Content-Type-Options / HSTS only work as real HTTP headers
         (browsers ignore them in <meta>), so they are set in vercel.json instead. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Fonts are self-hosted (public/fonts, @font-face in src/shared/styles/fonts.css).
         Preload the two latin files every page uses so text renders in the right font sooner. -->
    <link rel="preload" href="/fonts/righteous-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inconsolata-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
